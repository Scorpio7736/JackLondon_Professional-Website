name: Clean MI6 sprite shadows
on:
  push:
    branches: [Updates]
    paths:
      - 'scripts/clean_bond_shadows.py'
      - '.github/workflows/clean-bond-shadows.yml'
permissions:
  contents: write
jobs:
  clean-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Updates
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - run: python scripts/clean_bond_shadows.py
      - name: Commit cleaned sprite PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images/EasterEggs/Bond_Frame_*.png
          if ! git diff --cached --quiet; then
            git commit -m "Remove background shadows from all MI6 sprite frames"
            git push origin HEAD:Updates
          fi
