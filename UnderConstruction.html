<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jack London — Under Construction</title>

    <meta
        name="description"
        content="Jack London's professional portfolio is currently under construction."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="icon"
        href="Images/Icons/ResumeWebsite_ICON.png"
    >

    <style>

        /* =========================================================
           VARIABLES
           ========================================================= */

        :root {
            --bg: #0b1120;
            --bg-soft: #0f172a;
            --card: #111827;

            --text: #e5e7eb;
            --muted: #9ca3af;

            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-soft: rgba(59, 130, 246, 0.15);

            --border: #1f2937;

            --shadow:
                0 22px 55px rgba(0, 0, 0, 0.45);
        }


        /* =========================================================
           BASE
           ========================================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            min-height: 100%;
        }


        body {
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;

            padding: 2rem;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at top,
                    rgba(59, 130, 246, 0.16),
                    transparent 45%
                ),
                radial-gradient(
                    circle at bottom,
                    rgba(37, 99, 235, 0.08),
                    transparent 45%
                ),
                var(--bg);
        }


        /* =========================================================
           CARD
           ========================================================= */

        .construction-card {
            width: min(100%, 760px);

            padding: 3.5rem 3rem;

            text-align: center;

            background:
                radial-gradient(
                    circle at top,
                    rgba(59, 130, 246, 0.10),
                    transparent 55%
                ),
                var(--card);

            border:
                1px solid var(--border);

            border-radius:
                22px;

            box-shadow:
                var(--shadow);

            animation:
                fadeIn 0.6s ease;
        }


        /* =========================================================
           LOGO
           ========================================================= */

        .logo {
            width: 110px;
            height: 110px;

            margin-bottom: 1.75rem;

            object-fit: contain;

            border-radius: 50%;

            box-shadow:
                0 16px 35px rgba(0, 0, 0, 0.35);
        }


        /* =========================================================
           TEXT
           ========================================================= */

        .eyebrow {
            margin:
                0 0 0.75rem;

            color:
                var(--accent);

            font-family:
                "Orbitron",
                sans-serif;

            font-size:
                0.8rem;

            font-weight:
                700;

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;
        }


        h1 {
            margin:
                0 0 1rem;

            font-family:
                "Orbitron",
                sans-serif;

            font-size:
                clamp(2rem, 5vw, 3.4rem);

            line-height:
                1.15;
        }


        .accent {
            color:
                var(--accent);
        }


        .description {
            max-width:
                580px;

            margin:
                0 auto;

            color:
                var(--muted);

            font-size:
                1.05rem;

            line-height:
                1.75;
        }


        /* =========================================================
           STATUS
           ========================================================= */

        .status {
            display:
                inline-flex;

            align-items:
                center;

            gap:
                0.65rem;

            margin-top:
                2rem;

            padding:
                0.65rem 1rem;

            color:
                var(--text);

            background:
                var(--accent-soft);

            border:
                1px solid rgba(59, 130, 246, 0.35);

            border-radius:
                999px;

            font-size:
                0.9rem;
        }


        .status-dot {
            width:
                9px;

            height:
                9px;

            border-radius:
                50%;

            background:
                var(--accent);

            box-shadow:
                0 0 12px var(--accent);

            animation:
                pulse 1.8s infinite;
        }


        /* =========================================================
           LINKS
           ========================================================= */

        .links {
            display:
                flex;

            flex-wrap:
                wrap;

            justify-content:
                center;

            gap:
                0.8rem;

            margin-top:
                2.2rem;
        }


        .btn {
            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                0.8rem 1.25rem;

            color:
                var(--text);

            text-decoration:
                none;

            font-weight:
                600;

            border:
                1px solid #374151;

            border-radius:
                999px;

            background:
                var(--bg-soft);

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                border-color 0.15s ease;
        }


        .btn:hover {
            transform:
                translateY(-2px);

            border-color:
                var(--accent);
        }


        .btn.primary {
            color:
                #ffffff;

            background:
                var(--accent);

            border-color:
                var(--accent);
        }


        .btn.primary:hover {
            background:
                var(--accent-hover);
        }


        /* =========================================================
           FOOTER
           ========================================================= */

        .footer {
            margin-top:
                2.5rem;

            color:
                #6b7280;

            font-size:
                0.8rem;
        }


        /* =========================================================
           ANIMATIONS
           ========================================================= */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            body {
                padding: 1rem;
            }


            .construction-card {
                padding:
                    2.5rem 1.5rem;
            }


            .logo {
                width:
                    90px;

                height:
                    90px;
            }


            .links {
                flex-direction:
                    column;
            }


            .btn {
                width:
                    100%;
            }

        }

    </style>

</head>


<body>

    <main class="construction-card">

        <img
            class="logo"
            src="Images/Icons/Headshot_ICON.png"
            alt="Jack London Logo"
        >


        <p class="eyebrow">
            Jack London
        </p>


        <h1>
            Portfolio
            <span class="accent">
                Under Construction
            </span>
        </h1>


        <p class="description">
            My professional portfolio is currently being rebuilt and expanded.
            New project pages, updated experience, and additional development
            work are being added.
        </p>


        <div class="status">

            <span class="status-dot"></span>

            Website Update In Progress

        </div>


        <div class="links">

            <a
                class="btn primary"
                href="Resume.pdf"
                target="_blank"
                rel="noopener"
            >
                View Résumé
            </a>


            <a
                class="btn"
                href="https://github.com/Scorpio7736"
                target="_blank"
                rel="noopener"
            >
                GitHub ↗
            </a>


            <a
                class="btn"
                href="https://www.linkedin.com/in/jack-london-8a4001220"
                target="_blank"
                rel="noopener"
            >
                LinkedIn ↗
            </a>

        </div>


        <p class="footer">
            © <span id="year"></span> Jack London. All rights reserved.
        </p>

    </main>


    <script>

        document.getElementById("year").textContent =
            new Date().getFullYear();

    </script>

</body>

</html>
